<!DOCTYPE html>

<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddgeir — Treningsprogram</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #181818;
  --bg3: #222;
  --border: #2a2a2a;
  --border2: #383838;
  --text: #e8e6e0;
  --muted: #888;
  --accent: #b5f0a0;
  --accent2: #7dd86a;
  --warn: #f0c060;
  --info: #80c8f0;
  --red: #f08080;
  --radius: 10px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.5;
}

/* NAV */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,15,15,0.95);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center; gap: 0;
  height: 52px;
  backdrop-filter: blur(8px);
}
.nav-brand {
  font-family: 'DM Mono', monospace;
  font-size: 13px; font-weight: 500;
  color: var(--accent);
  margin-right: 24px;
  letter-spacing: 0.05em;
}
.nav-tab {
  padding: 0 16px; height: 52px;
  display: flex; align-items: center;
  font-size: 13px; color: var(--muted);
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent;
  transition: all .15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* PAGES */
.page { display: none; padding: 24px 20px; max-width: 900px; margin: 0 auto; }
.page.active { display: block; }

/* WEEK HEADER */
.week-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.week-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: var(--muted); letter-spacing: .08em;
}
.week-selector {
  display: flex; align-items: center; gap: 10px;
}
.week-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border2);
  background: none; color: var(--text);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.week-btn:hover { border-color: var(--accent); color: var(--accent); }
.week-num {
  font-size: 22px; font-weight: 600;
  min-width: 80px; text-align: center;
}

/* DAY CARDS */
.day-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px; margin-bottom: 24px;
}
.day-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 10px;
  cursor: pointer; transition: all .15s; text-align: center;
}
.day-card:hover:not(.rest) { border-color: var(--border2); transform: translateY(-1px); }
.day-card.active-day { border-color: var(--accent); background: #1a2a1a; }
.day-card.rest { opacity: .4; cursor: default; }
.day-card.done { border-color: #2a4a2a; }
.day-card .dc-name { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-bottom: 4px; }
.day-card .dc-type { font-size: 13px; font-weight: 500; }
.day-card .dc-dot {
  width: 6px; height: 6px; border-radius: 50%;
  margin: 6px auto 0;
}
.dot-styrke { background: var(--accent); }
.dot-kondis { background: var(--info); }
.dot-hvile  { background: var(--border2); }
.dot-mobil  { background: var(--warn); }

/* WORKOUT PANEL */
.workout-panel {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wp-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 4px;
}
.wp-title { font-size: 20px; font-weight: 600; }
.wp-note { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }

/* EXERCISE CARDS */
.ex-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px;
  overflow: hidden; transition: border-color .15s;
}
.ex-card.expanded { border-color: var(--border2); }
.ex-card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
}
.ex-num-badge {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-family: 'DM Mono', monospace;
  color: var(--muted); flex-shrink: 0;
}
.ex-info { flex: 1; }
.ex-name { font-weight: 500; font-size: 14px; }
.ex-sets { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ex-chevron {
  font-size: 14px; color: var(--muted);
  transition: transform .2s;
}
.ex-card.expanded .ex-chevron { transform: rotate(180deg); }
.ex-done-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--border2);
  background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .15s; flex-shrink: 0;
}
.ex-done-check.checked { border-color: var(--accent); background: var(--accent); color: #0f0f0f; }

.ex-body {
  display: none; padding: 0 16px 16px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.ex-card.expanded .ex-body { display: block; }

.ex-gif-wrap {
  width: 100%; max-width: 320px;
  background: var(--bg); border-radius: 8px;
  margin-bottom: 14px; overflow: hidden;
  aspect-ratio: 16/9;
  display: flex; align-items: center; justify-content: center;
}
.ex-gif-wrap img {
  width: 100%; height: 100%; object-fit: contain;
}
.ex-gif-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); font-size: 13px;
}
.ex-gif-placeholder span { font-size: 32px; }

.ex-desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.ex-prog-box {
  background: var(--bg); border-left: 2px solid var(--accent);
  border-radius: 0 6px 6px 0; padding: 10px 12px; margin-bottom: 12px;
}
.ex-prog-label { font-size: 11px; letter-spacing: .06em; color: var(--accent); margin-bottom: 4px; }
.ex-prog-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.ex-links { display: flex; gap: 8px; flex-wrap: wrap; }
.ex-link {
  font-size: 12px; padding: 5px 12px;
  border: 1px solid var(--border2); border-radius: 20px;
  color: var(--info); text-decoration: none;
  transition: all .15s;
}
.ex-link:hover { border-color: var(--info); background: rgba(128,200,240,.08); }

/* LOG WORKOUT */
.log-btn {
  width: 100%; padding: 14px;
  background: var(--accent); color: #0f0f0f;
  border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 600; cursor: pointer;
  margin-top: 16px; transition: all .15s;
  font-family: 'DM Sans', sans-serif;
}
.log-btn:hover { background: var(--accent2); }
.log-btn:disabled { opacity: .4; cursor: not-allowed; }

/* PROGRESS BAR */
.progress-row { margin-bottom: 20px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-bottom: 6px;
}
.progress-track {
  height: 4px; background: var(--border);
  border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px; transition: width .5s ease;
}

/* HISTORY PAGE */
.hist-empty {
  text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: 14px;
}
.hist-entry {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 8px; display: flex;
  align-items: center; justify-content: space-between;
}
.hist-left {}
.hist-date { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
.hist-title { font-size: 14px; font-weight: 500; margin-top: 2px; }
.hist-exs { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hist-right { display: flex; align-items: center; gap: 8px; }
.hist-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 10px;
  background: #1a2a1a; color: var(--accent); border: 1px solid #2a4a2a;
}

/* STATS */
.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-bottom: 24px;
}
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; text-align: center;
}
.stat-val { font-size: 28px; font-weight: 600; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* PROGRESJON PAGE */
.prog-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.prog-table th {
  text-align: left; padding: 8px 12px;
  border-bottom: 1px solid var(--border2);
  font-size: 11px; color: var(--muted); letter-spacing: .06em; font-weight: 500;
}
.prog-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.prog-table tr:last-child td { border-bottom: none; }
.prog-table tr:hover td { background: var(--bg3); }
.prog-wk { font-family: 'DM Mono', monospace; color: var(--muted); font-size: 12px; }
.prog-current { background: #1a2a1a !important; }
.prog-done-row { opacity: .5; }

/* SECTION HEADERS */
.section-head { font-size: 11px; color: var(--muted); letter-spacing: .08em; margin: 20px 0 10px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #0f0f0f;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
  z-index: 200;
}
.toast.show { opacity: 1; }

/* RESPONSIVE */
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .day-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">ODDGEIR.FIT</div>

<div class="page" id="page-historikk">

  <div id="hist-list"></div>
</div>

<div class="toast" id="toast"></div>

function getTemplate(week) {
  for (const t of WEEK_TEMPLATES) if (week >= t.range[0] && week <= t.range[1]) return t;
  return WEEK_TEMPLATES[WEEK_TEMPLATES.length-1];
}

// STATE
let state = {
  currentWeek: 1,
  openDay: null,
  checked: {} // { "w1_d0_e2": true }
};
let history = JSON.parse(localStorage.getItem('fit_history') || '[]');
let savedState = JSON.parse(localStorage.getItem('fit_state') || 'null');
if (savedState) { state.currentWeek = savedState.currentWeek || 1; state.checked = savedState.checked || {}; }

function saveState() { localStorage.setItem('fit_state', JSON.stringify({currentWeek:state.currentWeek, checked:state.checked})); }

// ===== RENDER =====
function render() {
  renderDayGrid();
  if (state.openDay !== null) renderWorkout(state.openDay);
  else document.getElementById('workout-area').innerHTML = '';
  updateWeekDisplay();
  renderProgTable();
  renderHistory();
}

function updateWeekDisplay() {
  document.getElementById('week-display').textContent = 'Uke ' + state.currentWeek;
  const pct = Math.round(((state.currentWeek-1)/12)*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = (state.currentWeek-1)+' av 12 uker';
}

function renderDayGrid() {
  const tmpl = getTemplate(state.currentWeek);
  const grid = document.getElementById('day-grid');
  grid.innerHTML = tmpl.days.map((d, i) => {
    const dayKey = 'w'+state.currentWeek+'_d'+i;
    const done = isWorkoutDone(dayKey, d);
    return `<div class="day-card ${d.type==='hvile'&&!d.exercises.length?'rest':''} ${state.openDay===i?'active-day':''} ${done?'done':''}"
      onclick="${d.exercises.length?`openDay(${i})`:''}">
      <div class="dc-name">${d.day}</div>
      <div class="dc-type">${d.label}</div>
      <div class="dc-dot dot-${d.type}"></div>
    </div>`;
  }).join('');
}

function isWorkoutDone(dayKey, d) {
  return d.exercises.length > 0 && d.exercises.every((_, ei) => state.checked[dayKey+'_e'+ei]);
}

function openDay(i) {
  state.openDay = i;
  renderDayGrid();
  renderWorkout(i);
  setTimeout(() => document.getElementById('workout-area').scrollIntoView({behavior:'smooth', block:'nearest'}), 50);
}

function renderWorkout(i) {
  const tmpl = getTemplate(state.currentWeek);
  const d = tmpl.days[i];
  const dayKey = 'w'+state.currentWeek+'_d'+i;
  if (!d.exercises.length) { document.getElementById('workout-area').innerHTML=''; return; }

  const allDone = d.exercises.every((_, ei) => state.checked[dayKey+'_e'+ei]);

  let html = `<div class="workout-panel">
    <div class="wp-header">
      <div class="wp-title">${d.day} — ${d.label}</div>
    </div>
    <div class="wp-note">${d.note}</div>`;

  d.exercises.forEach((ex, ei) => {
    const chk = !!state.checked[dayKey+'_e'+ei];
    const data = EXERCISES[ex.id] || {};
    html += `<div class="ex-card" id="ex-${ei}">
      <div class="ex-card-header" onclick="toggleEx(${ei})">
        <div class="ex-num-badge">${ei+1}</div>
        <div class="ex-info">
          <div class="ex-name">${data.name||ex.id}</div>
          <div class="ex-sets">${ex.sets}</div>
        </div>
        <button class="ex-done-check ${chk?'checked':''}" onclick="event.stopPropagation();toggleCheck('${dayKey}',${ei})" title="Marker ferdig">
          ${chk?'✓':''}
        </button>
        <div class="ex-chevron">▾</div>
      </div>
      <div class="ex-body">
        ${data.gif
          ? `<div class="ex-gif-wrap"><img src="${data.gif}" alt="${data.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=ex-gif-placeholder><span>🏋️</span>Animasjon ikke tilgjengelig</div>'"></div>`
          : data.name === 'Intervall roing' || data.name === 'Håndleddstrekk' || !data.gif
            ? `<div class="ex-gif-wrap"><div class="ex-gif-placeholder"><span>${data.name.includes('Hånd')?'🤲':data.name.includes('roing')||data.name.includes('Roing')?'🚣':'🏋️'}</span>Se videolenke</div></div>`
            : ''
        }
        <div class="ex-desc">${data.desc||''}</div>
        ${ex.prog ? `<div class="ex-prog-box"><div class="ex-prog-label">PROGRESJON</div><div class="ex-prog-text">${ex.prog}</div></div>` : ''}
        <div class="ex-links">
          ${(data.links||[]).map(l=>`<a class="ex-link" href="${l.url}" target="_blank">${l.label}</a>`).join('')}
        </div>
      </div>
    </div>`;
  });

  html += `<button class="log-btn" id="log-btn" onclick="logWorkout(${i})" ${allDone?'':'disabled'}>
    ${allDone ? '✓ Logg denne økten' : 'Marker alle øvelser for å logge'}
  </button></div>`;

  document.getElementById('workout-area').innerHTML = html;
}

function toggleEx(ei) {
  const card = document.getElementById('ex-'+ei);
  card.classList.toggle('expanded');
}

function toggleCheck(dayKey, ei) {
  const k = dayKey+'_e'+ei;
  state.checked[k] = !state.checked[k];
  saveState();
  renderWorkout(state.openDay);
  renderDayGrid();
}

function logWorkout(dayIndex) {
  const tmpl = getTemplate(state.currentWeek);
  const d = tmpl.days[dayIndex];
  const now = new Date();
  history.unshift({
    date: now.toISOString(),
    week: state.currentWeek,
    day: d.day,
    label: d.label,
    exercises: d.exercises.length,
    type: d.type
  });
  localStorage.setItem('fit_history', JSON.stringify(history));
  showToast('Økt logget! 💪');
  renderHistory();
}

function changeWeek(dir) {
  const nw = Math.max(1, Math.min(12, state.currentWeek + dir));
  state.currentWeek = nw;
  state.openDay = null;
  saveState();
  render();
}

function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if (id === 'historikk') renderHistory();
  if (id === 'progresjon') renderProgTable();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// PROGRESJON TABLE
function renderProgTable() {
  const weeks = [
    {w:[1,4], label:"Uke 1–4: Bygg grunnlag", rows:[
      {wk:"1–2", push:"Pike push-up 3×6–8", pull:"Inverted row (bøyde ben) 3×8", ben:"Bulgarsk split 3×6, neg. pistol 2×4", core:"Hollow 3×20 sek", hand:"Scap push-up 2×10", cond:"8 intervaller"},
      {wk:"3–4", push:"Pike push-up 3×10", pull:"Inverted row (strake ben) 3×8", ben:"Split 3×8, neg. pistol 3×5", core:"Hollow 3×30 sek", hand:"Scap push-up 2×12", cond:"10 intervaller"},
    ]},
    {w:[5,8], label:"Uke 5–8: Øk intensitet + VEGGSTØTTE", rows:[
      {wk:"5–6", push:"Pike push-up (fot elevert) 3×10", pull:"Inverted row (lav vinkel) 3×12", ben:"Split 3×10, neg. pistol 3×6", core:"Hollow 3×45 sek", hand:"Veggstøtte 5×15 sek", cond:"10 intervaller"},
      {wk:"7–8", push:"Pike push-up (smal+elevert) 3×12", pull:"Pull-up med strikk 3×5 / row 3×15", ben:"Split med vekt, neg. pistol 3×6 (2 sek bunn)", core:"Hollow 3×60 sek", hand:"Veggstøtte 5×25 sek", cond:"10 int. + løpeturer"},
    ]},
    {w:[9,12], label:"Uke 9–12: Avansert", rows:[
      {wk:"9–10", push:"Pike push-up smal 3×12", pull:"Pull-up 3×3–5 ELLER row 3×15", ben:"Pistol squat forsøk, split +vekt 3×12", core:"Hollow 3×60 sek", hand:"Veggstøtte 5×30 sek + løsne", cond:"12 intervaller"},
      {wk:"11–12", push:"Archer push-up 3×6/side ELLER pike 3×15", pull:"Pull-up 3×5–8", ben:"Pistol squat 3×3/side", core:"L-sit forsøk", hand:"Fristående håndstand forsøk", cond:"12 int. + løp"},
    ]},
  ];

  let html = '';
  for (const section of weeks) {
    const isCurrent = state.currentWeek >= section.w[0] && state.currentWeek <= section.w[1];
    html += `<div class="section-head">${section.label}</div>
    <div style="overflow-x:auto;margin-bottom:20px;">
    <table class="prog-table">
      <tr><th>Uke</th><th>Push</th><th>Pull</th><th>Ben</th><th>Core</th><th>Håndstand</th><th>Kondis</th></tr>`;
    for (const r of section.rows) {
      const done = !isCurrent && state.currentWeek > section.w[1];
      const curr = isCurrent && r.wk.includes(state.currentWeek) || (isCurrent && r.wk === section.rows[0].wk && state.currentWeek <= parseInt(r.wk.split('–')[1]));
      html += `<tr class="${done?'prog-done-row':''} ${isCurrent && section.rows.indexOf(r)===0 && state.currentWeek<=parseInt(r.wk.split('–')[1])?'prog-current':''}">
        <td class="prog-wk">${r.wk}</td><td>${r.push}</td><td>${r.pull}</td><td>${r.ben}</td><td>${r.core}</td><td>${r.hand}</td><td>${r.cond}</td>
      </tr>`;
    }
    html += '</table></div>';
  }
  document.getElementById('prog-table-wrap').innerHTML = html;
}

// HISTORY
function renderHistory() {
  const totalEl = document.getElementById('stat-total');
  const streakEl = document.getElementById('stat-streak');
  const weekEl = document.getElementById('stat-week');
  if (totalEl) totalEl.textContent = history.length;

  // This week count
  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-now.getDay()+1);
  startOfWeek.setHours(0,0,0,0);
  const thisWeekCount = history.filter(h => new Date(h.date) >= startOfWeek).length;
  if (weekEl) weekEl.textContent = thisWeekCount;

  // Streak
  let streak = 0;
  const days = new Set(history.map(h => new Date(h.date).toDateString()));
  let d = new Date(); d.setHours(0,0,0,0);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate()-1); }
  if (streakEl) streakEl.textContent = streak;

  const list = document.getElementById('hist-list');
  if (!list) return;
  if (!history.length) {
    list.innerHTML = '<div class="hist-empty">Ingen loggede økter ennå.<br>Fullfør en økt og trykk "Logg"!</div>';
    return;
  }
  list.innerHTML = history.map(h => {
    const d = new Date(h.date);
    const dateStr = d.toLocaleDateString('no-NO',{weekday:'short',day:'numeric',month:'short'});
    const timeStr = d.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-entry">
      <div class="hist-left">
        <div class="hist-date">${dateStr} · ${timeStr}</div>
        <div class="hist-title">Uke ${h.week} — ${h.label}</div>
        <div class="hist-exs">${h.exercises} øvelser · ${h.type}</div>
      </div>
      <div class="hist-right">
        <div class="hist-badge">✓ Ferdig</div>
      </div>
    </div>`;
  }).join('');
}

render();
